<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscar propiedad | Arrendamientos App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/custom.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } },
        };
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="font-sans antialiased bg-[#F5F7F9]">

    <div id="initial-loader" class="fixed inset-0 bg-[#FFC533] flex flex-col items-center justify-center z-50 transition-opacity duration-300">
        <div class="w-14 h-14 border-4 border-[#13243E]/10 border-t-[#13243E] rounded-full animate-spin mb-4"></div>
        <p class="text-[#13243E] text-sm font-semibold tracking-wide">Buscando propiedades…</p>
    </div>

    <div id="page-template" class="hidden">

        <div class="mb-6 anim-fade-in-up">
            <h3 class="text-[#13243E] font-extrabold text-xl flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot text-[#FFC533]"></i> Explorar Propiedades
            </h3>
            <p class="text-[#6F88A1] text-sm mt-0.5 font-medium">Encuentra el lugar ideal y solicita un contrato directamente con el dueño.</p>
        </div>

        <div class="flex flex-col lg:flex-row gap-6 h-[calc(100vh-140px)]">

            <div class="w-full lg:w-1/2 xl:w-5/12 flex flex-col h-full bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden anim-fade-in-up anim-delay-1">

                <div class="p-4 border-b border-slate-100 bg-white space-y-3 z-10 shadow-sm">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-[#6F88A1]"></i>
                        <input id="f-buscar" type="text" placeholder="Buscar por nombre, zona o ciudad..."
                               class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-sm text-[#13243E] outline-none transition-all font-medium">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <select id="f-tipo" class="px-3 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-xs text-[#13243E] font-bold outline-none transition-all">
                            <option value="">Tipo de propiedad</option>
                            <option value="DEPARTAMENTO">Departamento</option>
                            <option value="CASA">Casa</option>
                            <option value="LOCAL">Local Comercial</option>
                        </select>
                        <div class="flex gap-2">
                            <input id="f-precio-min" type="number" placeholder="Min $" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-xs text-[#13243E] font-bold outline-none transition-all">
                            <input id="f-precio-max" type="number" placeholder="Max $" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-xs text-[#13243E] font-bold outline-none transition-all">
                        </div>
                    </div>

                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1 pt-1">
                        <label class="flex-shrink-0 relative">
                            <input type="checkbox" name="beneficios" value="estacionamiento" class="peer sr-only">
                            <div class="px-3 py-1.5 rounded-lg border border-slate-200 text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider cursor-pointer transition-all peer-checked:bg-[#FFFBEB] peer-checked:border-[#FFE788] peer-checked:text-[#13243E]">
                                <i class="fas fa-car mr-1"></i> Estacionamiento
                            </div>
                        </label>
                        <label class="flex-shrink-0 relative">
                            <input type="checkbox" name="beneficios" value="mascota" class="peer sr-only">
                            <div class="px-3 py-1.5 rounded-lg border border-slate-200 text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider cursor-pointer transition-all peer-checked:bg-[#FFFBEB] peer-checked:border-[#FFE788] peer-checked:text-[#13243E]">
                                <i class="fas fa-paw mr-1"></i> Mascotas
                            </div>
                        </label>
                        <label class="flex-shrink-0 relative">
                            <input type="checkbox" name="beneficios" value="gimnasio" class="peer sr-only">
                            <div class="px-3 py-1.5 rounded-lg border border-slate-200 text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider cursor-pointer transition-all peer-checked:bg-[#FFFBEB] peer-checked:border-[#FFE788] peer-checked:text-[#13243E]">
                                <i class="fas fa-dumbbell mr-1"></i> Gimnasio
                            </div>
                        </label>
                    </div>
                </div>

                <div class="px-4 py-2 bg-[#F5F7F9] border-b border-slate-100 flex justify-between items-center flex-shrink-0">
                    <span id="count-resultados" class="text-xs font-bold text-[#13243E] uppercase tracking-wider">Cargando...</span>
                </div>

                <div id="lista-resultados" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#F5F7F9] custom-scrollbar">
                    <div class="bg-white rounded-xl border border-slate-200 p-4 animate-pulse">
                        <div class="h-4 bg-slate-100 rounded w-2/3 mb-2"></div>
                        <div class="h-3 bg-slate-100 rounded w-1/2 mb-4"></div>
                        <div class="h-8 bg-slate-50 rounded-lg w-1/3"></div>
                    </div>
                </div>
            </div>

            <div class="hidden lg:flex flex-col flex-1 h-full relative rounded-2xl overflow-hidden shadow-sm border border-slate-200 anim-fade-in-up anim-delay-2">
                <div class="absolute inset-0 bg-slate-100">
                    <iframe id="map-iframe" width="100%" height="100%" frameborder="0" style="border:0"
                            src="https://maps.google.com/maps?q=Mexico&t=m&z=5&output=embed&iwloc=near" allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-container"></div>

    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/buscar-propiedad.js"></script>

    <script>
    (async () => {
        try {
            await LAYOUT.inyectarLayout({ paginaActiva: 'buscar' });
            LAYOUT.setPageTitle('Buscar propiedad');

            const loader = document.getElementById('initial-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }

            const usuario = await AUTH.obtenerUsuarioActual();
            if (!usuario) { window.location.replace('../index.html'); return; }
            if (usuario.rol !== 'INQUILINO') {
                window.location.replace('dashboard-arrendador.html');
                return;
            }

            BUSCAR_PROPIEDAD.init(usuario);
        } catch (err) {
            console.error('[BUSCAR-PROP] Error de init:', err);
        }
    })();
    </script>
</body>
</html>
