<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Arrendador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <h5 class="mb-4"><i class="bi bi-building"></i> Arrendamientos</h5>
            <nav class="nav flex-column">
                <a class="nav-link active" data-modulo="inicio"><i class="bi bi-house"></i> Inicio</a>
                <a class="nav-link" data-modulo="propiedades"><i class="bi bi-houses"></i> Propiedades</a>
                <a class="nav-link" data-modulo="inquilinos"><i class="bi bi-people"></i> Inquilinos</a>
                <a class="nav-link" data-modulo="contratos"><i class="bi bi-file-earmark-text"></i> Contratos</a>
                <a class="nav-link" data-modulo="pagos"><i class="bi bi-cash-stack"></i> Pagos</a>
                <a class="nav-link" data-modulo="incidencias"><i class="bi bi-exclamation-triangle"></i> Incidencias</a>
                <a class="nav-link" data-modulo="reportes"><i class="bi bi-graph-up"></i> Reportes</a>
                <a class="nav-link" data-modulo="notificaciones">
                    <i class="bi bi-bell"></i> Notificaciones
                    <span id="badge-notif" class="badge bg-danger ms-1 d-none">0</span>
                </a>
            </nav>
            <hr class="border-secondary">
            <div class="mt-auto">
                <p class="small mb-1" id="nombre-usuario">—</p>
                <button class="btn btn-sm btn-outline-light w-100" id="btn-cerrar-sesion">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </button>
            </div>
        </aside>

        <main class="contenido-principal" id="contenido">
            <div class="text-center mt-5">
                <div class="spinner-border text-primary"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/propiedades.js"></script>
    <script src="../js/contratos.js"></script>
    <script src="../js/pagos.js"></script>
    <script src="../js/incidencias.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        (async () => {
            const usuario = await Auth.requerirAuth(['ARRENDADOR']);
            if (!usuario) return;

            document.getElementById('nombre-usuario').textContent = usuario.nombre_completo;
            document.getElementById('btn-cerrar-sesion')
                .addEventListener('click', () => Auth.cerrarSesion());

            const contenido = document.getElementById('contenido');
            const modulos = {
                inicio:         () => Dashboard.montarInicio(contenido, usuario),
                propiedades:    () => Propiedades.montar(contenido, usuario),
                inquilinos:     () => Propiedades.montarInquilinos(contenido),
                contratos:      () => Contratos.montar(contenido, usuario),
                pagos:          () => Pagos.montar(contenido, usuario),
                incidencias:    () => Incidencias.montar(contenido, usuario),
                reportes:       () => Dashboard.montarReportes(contenido, usuario),
                notificaciones: () => Notificaciones.montar(contenido, usuario)
            };

            document.querySelectorAll('[data-modulo]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('[data-modulo]').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    modulos[link.dataset.modulo]?.();
                });
            });

            // Badge de notificaciones no leídas
            const noLeidas = await Notificaciones.contarNoLeidas(usuario.usuario_id);
            if (noLeidas > 0) {
                const badge = document.getElementById('badge-notif');
                badge.textContent = noLeidas;
                badge.classList.remove('d-none');
            }

            modulos.inicio();
        })();
    </script>
</body>
</html>
