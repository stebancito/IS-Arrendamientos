<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Contratos | Arrendamientos App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/custom.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } },
        };
    </script>
</head>
<body class="font-sans antialiased bg-[#F5F7F9]">

    <div id="initial-loader"
         class="fixed inset-0 bg-[#FFC533] flex flex-col items-center justify-center z-50 transition-opacity duration-300">
        <div class="w-14 h-14 border-4 border-[#13243E]/10 border-t-[#13243E] rounded-full animate-spin mb-4"></div>
        <p class="text-[#13243E] text-sm font-semibold tracking-wide">Cargando contratos…</p>
    </div>

    <div id="page-template" class="hidden">

        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6 anim-fade-in-up">
            <div>
                <h3 class="text-[#13243E] font-extrabold text-xl">Gestión de contratos</h3>
                <p class="text-[#6F88A1] text-sm mt-0.5 font-medium">
                    Visualiza, filtra y administra todos tus contratos de arrendamiento.
                </p>
            </div>
            <a href="nuevo-contrato.html"
               class="inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl
                      bg-[#FFC533] hover:bg-[#FFD44A] text-[#13243E] text-sm font-bold
                      shadow-sm shadow-[#FFC533]/30 transition-colors self-start sm:self-auto">
                <i class="fa-solid fa-plus text-xs"></i>
                Nuevo contrato
            </a>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-1">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Pendientes</p>
                    <div class="w-8 h-8 rounded-lg bg-[#FFFBEB] border border-[#FFE788] flex items-center justify-center">
                        <i class="fa-solid fa-hourglass-half text-[#FFC533] text-sm"></i>
                    </div>
                </div>
                <p id="m-pendientes" class="text-[#13243E] font-extrabold text-2xl">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-2">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Activos</p>
                    <div class="w-8 h-8 rounded-lg bg-green-50 border border-green-100 flex items-center justify-center">
                        <i class="fa-solid fa-circle-check text-green-600 text-sm"></i>
                    </div>
                </div>
                <p id="m-activos" class="text-green-600 font-extrabold text-2xl">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-3">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Finalizados</p>
                    <div class="w-8 h-8 rounded-lg bg-[#F5F7F9] border border-slate-200 flex items-center justify-center">
                        <i class="fa-solid fa-flag-checkered text-[#6F88A1] text-sm"></i>
                    </div>
                </div>
                <p id="m-finalizados" class="text-[#13243E] font-extrabold text-2xl">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-4">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Cancelados</p>
                    <div class="w-8 h-8 rounded-lg bg-red-50 border border-red-100 flex items-center justify-center">
                        <i class="fa-solid fa-ban text-red-600 text-sm"></i>
                    </div>
                </div>
                <p id="m-cancelados" class="text-red-600 font-extrabold text-2xl">—</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 mb-5">
            <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-[#6F88A1] text-sm"></i>
                    <input id="f-buscar" type="text" placeholder="Buscar por inquilino, propiedad o folio…"
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-sm text-[#13243E] outline-none transition-all font-medium" />
                </div>
                <select id="f-estado" class="px-4 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-sm text-[#13243E] font-bold outline-none transition-all">
                    <option value="">Todos los estados</option>
                    <option value="PENDIENTE">Pendientes</option>
                    <option value="ACTIVO">Activos</option>
                    <option value="FINALIZADO">Finalizados</option>
                    <option value="TERMINADO">Cancelados</option>
                    <option value="RECHAZADO">Rechazados</option>
                </select>
                <select id="f-orden" class="px-4 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-sm text-[#13243E] font-bold outline-none transition-all">
                    <option value="reciente">Más recientes</option>
                    <option value="antiguo">Más antiguos</option>
                    <option value="monto-desc">Mayor renta</option>
                    <option value="monto-asc">Menor renta</option>
                </select>
            </div>
        </div>

        <div id="lista-contratos" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <div class="bg-white rounded-2xl border border-slate-100 p-5 animate-pulse">
                <div class="h-4 bg-[#F5F7F9] rounded w-1/2 mb-3"></div>
                <div class="h-3 bg-[#F5F7F9] rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-[#F5F7F9] rounded w-1/3"></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-5 animate-pulse">
                <div class="h-4 bg-[#F5F7F9] rounded w-1/2 mb-3"></div>
                <div class="h-3 bg-[#F5F7F9] rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-[#F5F7F9] rounded w-1/3"></div>
            </div>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/gestion-contratos.js"></script>

    <script>
    (async () => {
        try {
            await LAYOUT.inyectarLayout({ paginaActiva: 'contratos' });
            LAYOUT.setPageTitle('Gestión de contratos');

            const loader = document.getElementById('initial-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }

            const usuario = await AUTH.obtenerUsuarioActual();
            if (!usuario || usuario.rol !== 'ARRENDADOR') {
                window.location.replace('dashboard-inquilino.html');
                return;
            }
            GESTION_CONTRATOS.init(usuario);
        } catch (err) {
            console.error('[GESTION-CONTRATOS] init error:', err);
        }
    })();
    </script>
</body>
</html>
