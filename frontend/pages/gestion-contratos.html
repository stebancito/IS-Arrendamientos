<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Contratos | Arrendamientos App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/custom.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } },
        };
    </script>
</head>
<body class="font-sans antialiased bg-slate-50">

    <div id="initial-loader"
         class="fixed inset-0 bg-[#0f2557] flex flex-col items-center justify-center z-50 transition-opacity duration-300">
        <div class="w-14 h-14 border-4 border-blue-300/30 border-t-white rounded-full animate-spin mb-4"></div>
        <p class="text-blue-200 text-sm font-medium">Cargando contratos…</p>
    </div>

    <div id="page-template" class="hidden">

        <!-- Cabecera -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6 anim-fade-in-up">
            <div>
                <h3 class="text-slate-900 font-bold text-xl">Gestión de contratos</h3>
                <p class="text-slate-500 text-sm mt-0.5">
                    Visualiza, filtra y administra todos tus contratos de arrendamiento.
                </p>
            </div>
            <a href="nuevo-contrato.html"
               class="btn-primary inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl
                      bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold
                      shadow-md shadow-blue-600/25">
                <i class="fa-solid fa-plus text-xs"></i>
                Nuevo contrato
            </a>
        </div>

        <!-- Métricas rápidas -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-1">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Pendientes</p>
                    <div class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center">
                        <i class="fa-solid fa-hourglass-half text-amber-600 text-sm"></i>
                    </div>
                </div>
                <p id="m-pendientes" class="text-amber-600 font-bold text-2xl">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-2">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Activos</p>
                    <div class="w-8 h-8 rounded-lg bg-green-50 flex items-center justify-center">
                        <i class="fa-solid fa-circle-check text-green-600 text-sm"></i>
                    </div>
                </div>
                <p id="m-activos" class="text-green-600 font-bold text-2xl">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-3">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Finalizados</p>
                    <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center">
                        <i class="fa-solid fa-flag-checkered text-slate-600 text-sm"></i>
                    </div>
                </div>
                <p id="m-finalizados" class="text-slate-700 font-bold text-2xl">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-4">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Cancelados</p>
                    <div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center">
                        <i class="fa-solid fa-ban text-orange-600 text-sm"></i>
                    </div>
                </div>
                <p id="m-cancelados" class="text-orange-600 font-bold text-2xl">—</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 mb-5">
            <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input id="f-buscar" type="text" placeholder="Buscar por inquilino, propiedad o folio…"
                           class="input-brand w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm" />
                </div>
                <select id="f-estado" class="input-brand px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                    <option value="">Todos los estados</option>
                    <option value="PENDIENTE">Pendientes</option>
                    <option value="ACTIVO">Activos</option>
                    <option value="FINALIZADO">Finalizados</option>
                    <option value="TERMINADO">Cancelados</option>
                    <option value="RECHAZADO">Rechazados</option>
                </select>
                <select id="f-orden" class="input-brand px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm">
                    <option value="reciente">Más recientes</option>
                    <option value="antiguo">Más antiguos</option>
                    <option value="monto-desc">Mayor renta</option>
                    <option value="monto-asc">Menor renta</option>
                </select>
            </div>
        </div>

        <!-- Listado -->
        <div id="lista-contratos" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <!-- Skeleton -->
            <div class="bg-white rounded-2xl border border-slate-100 p-5 animate-pulse">
                <div class="h-4 bg-slate-200 rounded w-1/2 mb-3"></div>
                <div class="h-3 bg-slate-200 rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-slate-200 rounded w-1/3"></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-5 animate-pulse">
                <div class="h-4 bg-slate-200 rounded w-1/2 mb-3"></div>
                <div class="h-3 bg-slate-200 rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-slate-200 rounded w-1/3"></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-5 animate-pulse">
                <div class="h-4 bg-slate-200 rounded w-1/2 mb-3"></div>
                <div class="h-3 bg-slate-200 rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-slate-200 rounded w-1/3"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/gestion-contratos.js"></script>

    <script>
    (async () => {
        try {
            await LAYOUT.inyectarLayout({ paginaActiva: 'contratos' });
            LAYOUT.setPageTitle('Gestión de contratos');

            const loader = document.getElementById('initial-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }

            const usuario = await AUTH.obtenerUsuarioActual();
            if (!usuario || usuario.rol !== 'ARRENDADOR') {
                window.location.replace('dashboard-inquilino.html');
                return;
            }
            GESTION_CONTRATOS.init(usuario);
        } catch (err) {
            console.error('[GESTION-CONTRATOS] init error:', err);
        }
    })();
    </script>
</body>
</html>
