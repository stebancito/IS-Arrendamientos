<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión — Arrendamientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center mb-4">
                <i class="bi bi-building text-primary" style="font-size: 2.5rem;"></i>
                <h3 class="mt-2">Arrendamientos</h3>
            </div>

            <ul class="nav nav-pills nav-fill mb-4" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-login">Iniciar sesión</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-registro">Registrarse</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Login -->
                <div class="tab-pane fade show active" id="tab-login">
                    <form id="form-login">
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div id="error-login" class="alert alert-danger d-none"></div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>

                <!-- Registro -->
                <div class="tab-pane fade" id="tab-registro">
                    <form id="form-registro">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" name="nombre_completo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" name="telefono">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" name="password" minlength="6" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de cuenta</label>
                            <select class="form-select" name="rol" required>
                                <option value="INQUILINO">Inquilino</option>
                                <option value="ARRENDADOR">Arrendador (dueño)</option>
                            </select>
                        </div>
                        <div id="error-registro" class="alert alert-danger d-none"></div>
                        <div id="ok-registro" class="alert alert-success d-none"></div>
                        <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        (async () => {
            const sesion = await Auth.obtenerSesion();
            if (sesion) {
                const usuario = await Auth.obtenerUsuarioActual();
                if (usuario) Auth.redirigirSegunRol(usuario);
            }
        })();

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-login');
            errBox.classList.add('d-none');
            const fd = new FormData(e.target);
            const { error } = await Auth.iniciarSesion({
                email: fd.get('email'),
                password: fd.get('password')
            });
            if (error) {
                errBox.textContent = error.message;
                errBox.classList.remove('d-none');
                return;
            }
            const usuario = await Auth.obtenerUsuarioActual();
            Auth.redirigirSegunRol(usuario);
        });

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-registro');
            const okBox = document.getElementById('ok-registro');
            errBox.classList.add('d-none');
            okBox.classList.add('d-none');

            const fd = new FormData(e.target);
            const { error, warning } = await Auth.registrar({
                email: fd.get('email'),
                password: fd.get('password'),
                nombre_completo: fd.get('nombre_completo'),
                telefono: fd.get('telefono'),
                rol: fd.get('rol')
            });
            if (error) {
                errBox.textContent = error.message;
                errBox.classList.remove('d-none');
                return;
            }
            if (warning) {
                errBox.textContent = warning;
                errBox.classList.remove('d-none');
                return;
            }
            okBox.textContent = 'Cuenta creada. Si la confirmación por correo está activa, revísalo. Luego inicia sesión.';
            okBox.classList.remove('d-none');
            e.target.reset();
        });
    </script>
</body>
</html>
