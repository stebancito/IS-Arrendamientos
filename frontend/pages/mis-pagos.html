<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Pagos | Arrendamientos App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/custom.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } },
        };
    </script>
</head>
<body class="font-sans antialiased bg-slate-50">

    <div id="initial-loader"
         class="fixed inset-0 bg-[#0f2557] flex flex-col items-center justify-center z-50 transition-opacity duration-300">
        <div class="w-14 h-14 border-4 border-blue-300/30 border-t-white rounded-full animate-spin mb-4"></div>
        <p class="text-blue-200 text-sm font-medium">Cargando tus pagos…</p>
    </div>

    <div id="page-template" class="hidden">

        <!-- Cabecera -->
        <div class="mb-6 anim-fade-in-up">
            <h3 class="text-slate-900 font-bold text-xl">Mis pagos</h3>
            <p class="text-slate-500 text-sm mt-0.5">
                Consulta tu calendario de rentas y el estado de cada periodo.
            </p>
        </div>

        <!-- Banner próximo pago + totales -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mb-6">
            <!-- Próximo pago (destacado) -->
            <div id="proximo-pago"
                 class="lg:col-span-1 bg-gradient-to-br from-[#0c1f4a] via-[#0f2557] to-[#1a3680]
                        rounded-2xl p-5 text-white shadow-xl anim-fade-in-up anim-delay-1">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center">
                        <i class="fa-solid fa-calendar-day text-xl"></i>
                    </div>
                    <div>
                        <p class="text-blue-200/80 text-xs uppercase font-semibold tracking-wider">Próximo pago</p>
                        <p class="font-bold text-base">—</p>
                    </div>
                </div>
            </div>

            <!-- Totales -->
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-2">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Pagado</p>
                    <div class="w-8 h-8 rounded-lg bg-green-50 flex items-center justify-center">
                        <i class="fa-solid fa-circle-check text-green-600 text-sm"></i>
                    </div>
                </div>
                <p id="r-pagado" class="text-green-600 font-bold text-lg">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-3">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Pendiente</p>
                    <div class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center">
                        <i class="fa-solid fa-hourglass-half text-amber-600 text-sm"></i>
                    </div>
                </div>
                <p id="r-pendiente" class="text-amber-600 font-bold text-lg">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-4">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Vencido</p>
                    <div class="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center">
                        <i class="fa-solid fa-triangle-exclamation text-red-600 text-sm"></i>
                    </div>
                </div>
                <p id="r-vencido" class="text-red-600 font-bold text-lg">—</p>
            </div>
        </div>

        <!-- Listado de contratos con su calendario -->
        <div id="lista-mis-pagos" class="space-y-5">
            <!-- Skeleton -->
            <div class="bg-white rounded-2xl border border-slate-100 p-6 animate-pulse">
                <div class="h-4 bg-slate-200 rounded w-1/3 mb-3"></div>
                <div class="h-3 bg-slate-200 rounded w-2/3 mb-2"></div>
                <div class="h-3 bg-slate-200 rounded w-1/2"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/mis-pagos.js"></script>

    <script>
    (async () => {
        try {
            await LAYOUT.inyectarLayout({ paginaActiva: 'pagos' });
            LAYOUT.setPageTitle('Mis pagos');

            const loader = document.getElementById('initial-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }

            const usuario = await AUTH.obtenerUsuarioActual();
            if (!usuario) { window.location.replace('../index.html'); return; }
            if (usuario.rol === 'ARRENDADOR') {
                window.location.replace('pagos.html');
                return;
            }
            MIS_PAGOS.init(usuario);
        } catch (err) {
            console.error('[MIS-PAGOS] init error:', err);
        }
    })();
    </script>
</body>
</html>
