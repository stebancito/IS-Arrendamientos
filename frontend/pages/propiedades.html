<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Propiedades | Arrendamientos App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/custom.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } },
        };
    </script>
</head>

<body class="font-sans antialiased bg-[#F5F7F9]">

    <div id="initial-loader"
         class="fixed inset-0 bg-[#FFC533] flex flex-col items-center justify-center z-50 transition-opacity duration-300">
        <div class="w-14 h-14 border-4 border-[#13243E]/10 border-t-[#13243E] rounded-full animate-spin mb-4"></div>
        <p class="text-[#13243E] text-sm font-semibold tracking-wide">Cargando propiedades…</p>
    </div>

    <div id="page-template" class="hidden">

        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6 anim-fade-in-up">
            <div>
                <h3 class="text-[#13243E] font-extrabold text-xl">Mis propiedades</h3>
                <p class="text-[#6F88A1] text-sm mt-0.5">Administra tu portafolio de inmuebles.</p>
            </div>
            <a href="agregar-propiedad.html"
               class="inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl
                      bg-[#FFC533] hover:bg-[#FFD44A] text-[#13243E] text-sm font-bold
                      shadow-sm shadow-[#FFC533]/30 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                Agregar propiedad
            </a>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-1">
                <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Total</p>
                <p id="m-total" class="text-[#13243E] font-extrabold text-2xl mt-1">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-2">
                <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Ocupadas</p>
                <p id="m-ocupadas" class="text-[#FFC533] font-extrabold text-2xl mt-1">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-3">
                <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Disponibles</p>
                <p id="m-disponibles" class="text-[#255FA4] font-extrabold text-2xl mt-1">—</p>
            </div>
            <div class="stat-card bg-white rounded-2xl p-4 border border-slate-100 shadow-sm anim-fade-in-up anim-delay-4">
                <p class="text-[#6F88A1] text-[10px] font-bold uppercase tracking-wider">Edificios</p>
                <p id="m-edificios" class="text-[#13243E] font-extrabold text-2xl mt-1">—</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 mb-5">
            <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                <div class="relative flex-1">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#6F88A1]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
                    </svg>
                    <input id="f-buscar" type="text" placeholder="Buscar por nombre o dirección…"
                           class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-sm text-[#13243E] outline-none transition-all" />
                </div>

                <select id="f-tipo" class="px-3 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-sm text-[#13243E] outline-none transition-all">
                    <option value="">Todos los tipos</option>
                    <option value="EDIFICIO">Edificios</option>
                    <option value="DEPARTAMENTO">Departamentos</option>
                    <option value="CASA">Casas</option>
                    <option value="LOCAL">Locales</option>
                    <option value="TERRENO">Terrenos</option>
                </select>

                <select id="f-estado" class="px-3 py-2.5 rounded-xl border border-slate-200 bg-[#F5F7F9] focus:bg-white focus:border-[#FFC533] focus:ring-2 focus:ring-[#FFC533]/20 text-sm text-[#13243E] outline-none transition-all">
                    <option value="">Cualquier estado</option>
                    <option value="ocupada">Ocupada</option>
                    <option value="disponible">Disponible</option>
                </select>
            </div>
        </div>

        <div id="lista-propiedades" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <div class="bg-white rounded-2xl border border-slate-100 p-5 animate-pulse">
                <div class="h-4 bg-slate-100 rounded w-1/2 mb-3"></div>
                <div class="h-3 bg-slate-100 rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-slate-100 rounded w-1/3"></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-5 animate-pulse">
                <div class="h-4 bg-slate-100 rounded w-1/2 mb-3"></div>
                <div class="h-3 bg-slate-100 rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-slate-100 rounded w-1/3"></div>
            </div>
        </div>
    </div>


    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/propiedades.js"></script>

    <script>
    (async () => {
        try {
            await LAYOUT.inyectarLayout({ paginaActiva: 'propiedades' });
            LAYOUT.setPageTitle('Gestión de propiedades');

            const loader = document.getElementById('initial-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }

            const usuario = await AUTH.obtenerUsuarioActual();
            if (!usuario || usuario.rol !== 'ARRENDADOR') {
                window.location.replace('dashboard-inquilino.html');
                return;
            }
            PROPIEDADES.init(usuario);
        } catch (err) {
            console.error('[PROPIEDADES] Error de init:', err);
        }
    })();
    </script>
</body>
</html>
